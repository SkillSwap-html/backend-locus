spring.application.name=locus

#DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/locus_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

#FLYWAY
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

#REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.security.enabled=${SECURITY_ENABLED:false}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Integrações definidas na ERS. Todas ficam desligadas até receberem credenciais.
app.integrations.google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}
app.integrations.google.maps.javascript-api-key=${GOOGLE_MAPS_JAVASCRIPT_API_KEY:}
app.integrations.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.integrations.google.maps.base-url=${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com}
app.integrations.google.maps.timeout-ms=${GOOGLE_MAPS_TIMEOUT_MS:5000}

app.integrations.google.places.enabled=${GOOGLE_PLACES_ENABLED:false}
app.integrations.google.places.api-key=${GOOGLE_PLACES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
app.integrations.google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
app.integrations.google.places.timeout-ms=${GOOGLE_PLACES_TIMEOUT_MS:5000}

#ROTAS
app.integrations.google.routes.enabled=${GOOGLE_ROUTES_ENABLED:false}
app.integrations.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
app.integrations.google.routes.base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
app.integrations.google.routes.timeout-ms=${GOOGLE_ROUTES_TIMEOUT_MS:5000}

#STREET VIEW
app.integrations.google.street-view.enabled=${GOOGLE_STREET_VIEW_ENABLED:false}
app.integrations.google.street-view.api-key=${GOOGLE_STREET_VIEW_API_KEY:${GOOGLE_MAPS_API_KEY:}}
app.integrations.google.street-view.base-url=${GOOGLE_STREET_VIEW_BASE_URL:https://maps.googleapis.com}
app.integrations.google.street-view.timeout-ms=${GOOGLE_STREET_VIEW_TIMEOUT_MS:5000}

#GEMINI
app.integrations.gemini.enabled=${GEMINI_ENABLED:false}
app.integrations.gemini.api-key=${GEMINI_API_KEY:}
app.integrations.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.integrations.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.integrations.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:15000}
app.integrations.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
app.integrations.gemini.temperature=${GEMINI_TEMPERATURE:0.2}
app.integrations.gemini.web-search-enabled=${GEMINI_WEB_SEARCH_ENABLED:false}

#GROQ - fallback do assistente quando o Gemini estiver indisponível
app.integrations.groq.enabled=${GROQ_ENABLED:false}
app.integrations.groq.api-key=${GROQ_API_KEY:}
app.integrations.groq.base-url=${GROQ_BASE_URL:https://api.groq.com}
app.integrations.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.integrations.groq.timeout-ms=${GROQ_TIMEOUT_MS:15000}
app.integrations.groq.max-output-tokens=${GROQ_MAX_OUTPUT_TOKENS:2048}
app.integrations.groq.temperature=${GROQ_TEMPERATURE:0.2}

#AMADEUS
app.integrations.amadeus.enabled=${AMADEUS_ENABLED:true}
app.integrations.amadeus.mode=${AMADEUS_MODE:mock}
app.integrations.amadeus.base-url=${AMADEUS_BASE_URL:https://test.api.amadeus.com}
app.integrations.amadeus.client-id=${AMADEUS_CLIENT_ID:}
app.integrations.amadeus.client-secret=${AMADEUS_CLIENT_SECRET:}
app.integrations.amadeus.access-token=${AMADEUS_ACCESS_TOKEN:}
app.integrations.amadeus.timeout-ms=${AMADEUS_TIMEOUT_MS:10000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
